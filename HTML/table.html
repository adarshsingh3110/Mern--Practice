<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <!-- Header -->
     <h1>Student Marksheet Table</h1>

     <table border="1">
        <thead>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Adarsh</td>
                <td>HTML</td>
                <td>50</td>
            </tr>
            <tr>
                
                <td>Python</td>
                <td>70</td>
            </tr>

            <tr>
                <td>Harsh</td>
                <td>CSS</td>
                <td>60</td>
            </tr>
            <tr>
                <td>Aman</td>
                <td>Js</td>
                <td>80</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>260</td>
            </tr>
        </tfoot>

     </table>
</body>
</html>
