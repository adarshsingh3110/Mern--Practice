<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Structure</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div style="width: 100vw; height: 100vh; border: 3px solid rgb(247, 2, 2);">
        <div style="width: 99.6vw; height: 20vh; background-color: wheat;">
            <div style="width: 100%; height: 70%; border: 4px solid palevioletred;">
                <div style="display: flex; justify-content: space-around; padding: 20px;">
                     <h3>Amazon</h3>
                <p>Vadodara</p>
                    <div>
                        <input type="text">
                        <button>search</button>
                    </div>
                    <p>Account</p>
                    <p>Cart</p>
                </div>

            </div>
            <div style="width: 100%; height: 30%; border:4px solid green;">
                <ul style="display: flex; justify-content: space-around; list-style-type: none;">
                    <li>Bestseller</li>
                    <li>Home</li>
                    <li>Mens Wear</li>
                    <li>Kitchen</li>
                    <li>Amazon Pay</li>
                </ul>
            </div>
        </div>
        <div style="width: 100%; height: 80vh; background-color: rgb(253, 253, 0);">
            <div style="display: flex; justify-content: space-around;">
                        <img src="https://images-eu.ssl-images-amazon.com/images/G/31/img24/Media/1/toys/Desktop_tall_Hero_3000x1200_RC-Cars_1._CB784186419_.jpg" alt="img"  width="50%">
             </div> 
             <div style="display: flex; justify-content: space-between;">
                <div style="border: 2px solid black; width: 200px; height: 200px;"></div> 
              <div style="border: 2px solid black; width: 200px; height: 200px;"></div> 
               <div style="border: 2px solid black; width: 200px; height: 200px;"></div> 
                <div style="border: 2px solid black; width: 200px; height: 200px;"></div> 
             </div>
            </div>     
        </div>
    </div>
</body>
</html>
