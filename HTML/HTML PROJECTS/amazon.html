<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Structure</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
    </style>
</head>
<body style="background-color: #e3e6e6;">

    <!-- MAIN DIV -->
    <div style="width: 100%;">
        <!-- NAVBAR -->
        <div style="width: 100%;  background-color: #131921; color: white;">
            <!-- TOP NAVBAR -->
            <div style="width: 100%; padding: 15px 20px; display: flex; justify-content: space-around; align-items: center;">
                <!-- AMAZON LOGO -->

                <h1 style="color: orange;">Amazon</h1>
                <!-- LOCATION -->
                <div>
                    <p style="font-size: 12px;">Deliver to</p>
                    <h4>Vadodara</h4>
                </div>
                <!-- SEARCH BAR -->
                    <div style="width: 40%;">
                        <input type="text" placeholder="Search Amazon" style="width: 100%; padding: 10px; border: none; outline: none; font-size: 16px;">
                        <button style="width: 60px; background-color: orange; border: none; cursor: pointer;">search</button>
                    </div>
                    <!-- Account -->
                     <div>
                         <p style="font-size: 12px;">Hello, Sign in</p>
                         <h4>Account</h4>
                     </div>
                     <!-- CART -->
                      <div>
                        <h3>Cart</h3>
                      </div>
                   
                 </div>

                 <!-- MENU BAR -->
            <div style="width: 100%; background-color: #232f3e; padding: 12px;">
                <ul style="display: flex; justify-content: space-around; list-style-type: none;">
                    <li>Bestseller</li>
                    <li>Home</li>
                    <li>Mens Wear</li>
                    <li>Kitchen</li>
                    <li>Amazon Pay</li>
                    <li>Mobiles</li>
                    <li>Electronics</li>
                </ul>
            </div>
        </div>
        <!-- SECTION -->
        <div style="height: 400px;
                background-image: url('https://images-eu.ssl-images-amazon.com/images/G/31/img24/Media/1/toys/Desktop_tall_Hero_3000x1200_RC-Cars_1._CB784186419_.jpg');

                background-size: cover;
                background-position: center top;
                background-repeat: no-repeat;">

    </div>

    <!-- PRODUCTS -->

    <div style="display: flex;
                justify-content: space-around;
                flex-wrap: wrap;
                padding: 30px;">

        <!-- CARD 1 -->

        <div style="width: 250px;
                    background-color: white;
                    padding: 15px;
                    margin: 10px;
                    border-radius: 10px;
                    text-align: center;
                    box-shadow: 0 0 10px gray;">

            <img src="https://m.media-amazon.com/images/I/61bK6PMOC3L._SX679_.jpg"

            width="100%"
            height="220px">

            <h3>Headphones</h3>

            <p><b>₹1,499</b></p>

            <button style="background-color: #ffd814;
                           border: none;
                           padding: 10px 20px;
                           border-radius: 20px;
                           cursor: pointer;">

                Add to Cart

            </button>

        </div>

        <!-- CARD 2 -->
