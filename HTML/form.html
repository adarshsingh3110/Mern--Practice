<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body style="background-color:  #eaf4ff;">
    <!-- HEADER -->
     <h1>Student Registration Form</h1>
    
    <!-- FORM DETAILS -->
    <form>
        <fieldset>
        <legend><b>Personal Information</b></legend>
        <!-- NAME -->
        <label for="uname">Username:</label>
        <input type="text" id="uname" name="uname" placeholder="Enter your name" >
        <br><br>
        <!-- EMAIL -->
        <label for="ename">Email:</label>
        <input type="text" id="ename" name="ename" placeholder="example@gmail.com">
        <br><br>
        <!-- CONTACT -->
        <label for="conatct">Phone No: </label>
        <input type="tel" id="conatct" name="contact" placeholder="1234567890">
        <br><br>
        <!-- PASSWORD -->
        <label for="Password">Password: </label>
        <input type="password" id="Password" name="Password" placeholder="*******">
        <br><br>
        <!-- D.O.B -->
        <label for="dob">D.O.B:</label>
        <input type="date" name="dob" id="dob">
        <br><br>
        <!-- GENDER -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br>
        <br>
        <!-- FILE -->
        <label for="myfile">Select a file:</label>
        <input type="file" id="myfile" name="myfile">
        <br><br>
        <!-- MESSAGE -->
        <label for="Msg">Message</label>
        <textarea name="Msg" id="Msg" rows="5" cols="25" placeholder="write something"></textarea>
        <br>
        <br>
        <!-- TERM AND CONDITION -->
        <input type="checkbox" id="term" name="agree">
        <label for="term">I agree to the term and condition</label>
        <br><br>
        <!-- REGISTER -->
        <button>Register</button>
        </fieldset>

    </form>
</body>
</html>
