<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profle card</title>
    <style>
    .box{
        width: 300px;
        padding: 20px;
        border: 2px solid #ccc;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 4px  8px rgba(0, 0, 0, 1);
        margin: 50px auto;
        background-color: #f9f9f9 ;
    }
     .box .circle{
        width: 100px;
        height: 100px;
        border: 2px solid #ccc;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 auto 20px;
    }
    .circle img{
        width: 100%;
        height: 113%;
        object-fit: cover;
    }
    .box button{
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <div class="box">
        <h1>Profile Card</h1>
        <div class="circle">
            <img src="avatar.png" alt="avatar">
        </div>
        
        <h2>Adarsh Kumar Singh</h2>
        <h3>Mern Developer</h3>
        <button>Follow me</button>
    </div>
</body>
</html>
