<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        .box{
            width:300px;
            padding:20px;
            border:2px solid #ccc;
            border-radius:10px;
            text-align:center;
            box-shadow:0 4px 8px rgba(0,0,0,0.3);
            margin:50px auto;
            background:#f9f9f9;
        }

        .circle{
            width:100px;
            height:100px;
            border:2px solid #ccc;
            border-radius:50%;
            overflow:hidden;
            margin:0 auto 20px;
        }

        .circle img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        button{
            padding:10px 20px;
            border:none;
            border-radius:5px;
            background:#007bff;
            color:white;
            cursor:pointer;
            margin-top:10px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Profile Card</h1>

        <div class="circle">
            <img src="avatar.png" alt="avatar">
        </div>

        <h2 id="name">Adarsh Kumar Singh</h2>
        <h3 id="domain">MERN Developer</h3>

        <button id="changeBtn">Change Profile</button>
    </div>

    <script>
        let name = document.querySelector("#name");
        let domain = document.querySelector("#domain");
        let btn = document.querySelector("#changeBtn");

        btn.addEventListener("click", function () {
            name.textContent = "Rohit Sharma";
            domain.textContent = "Cricketer";
        });
    </script>

</body>
</html>
